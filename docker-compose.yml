# Standalone game engine. The shared world/tileset data lives outside the
# service's build context, so it is mounted in read-only at runtime.
services:
  game-service:
    build: ./services/game_service
    container_name: et-game-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      WORLD_JSON_PATH: /app/shared/static/world.json
      TILESET_DIR_PATH: /app/shared/tileset_metadata
      SAVE_DIR_PATH: /app/saves
    volumes:
      - ./services/shared:/app/shared:ro
      - game-saves:/app/saves

volumes:
  game-saves:
